name: Windows CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  BUILD_DIRECTORY: build-ci
  QT_VERSION: 6.10.3

jobs:
  build:
    name: Windows / build, test, and package
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # The anonymous Qt tools repository currently publishes IFW 4.7.
          # Move to 4.11 once Qt exposes qt.tools.ifw.411 there; using the
          # authenticated Qt Account repository would require CI credentials.
          tools: tools_ifw,qt.tools.ifw.47
          cache: true
          cache-key-prefix: install-qt-action-ifw47

      - name: Locate LLVM
        shell: pwsh
        run: |
          $clang = (Get-Command clang.exe -ErrorAction Stop).Source
          $llvmRoot = Split-Path (Split-Path $clang -Parent) -Parent
          "LLVM_ROOT=$llvmRoot" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using LLVM from $llvmRoot"

      - name: Determine package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = "dev-$($env:GITHUB_SHA.Substring(0, 8))"
          }
          "PACKAGE_VERSION=$version" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Package version: $version"

      - name: Configure MSVC Release build
        shell: pwsh
        run: |
          cmake -S . -B $env:BUILD_DIRECTORY `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DUUML_REQUIRE_LIBCLANG=ON `
            -DUUML_DEPLOY_QT_RUNTIME=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build $env:BUILD_DIRECTORY `
            --config Release --parallel

      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "$(Join-Path $env:QT_ROOT_DIR 'bin');$env:PATH"
          ctest --test-dir $env:BUILD_DIRECTORY `
            -C Release --output-on-failure --timeout 60

      - name: Upload visual regression diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-diagnostics-${{ github.sha }}
          path: ${{ env.BUILD_DIRECTORY }}/visual-regression-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Create portable package
        shell: pwsh
        run: |
          $arguments = @{
            BuildDirectory = $env:BUILD_DIRECTORY
            Configuration = "Release"
            Version = $env:PACKAGE_VERSION
            OutputDirectory = "out\packages"
            Verify = $true
          }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $arguments.RequireProjectVersionMatch = $true
          }
          & .\tools\package_windows.ps1 @arguments

      - name: Create and verify Windows installer
        shell: pwsh
        run: |
          & .\tools\build_windows_installer.ps1 `
            -PortableArchive `
              "out\packages\yauml-$env:PACKAGE_VERSION-windows-x64.zip" `
            -Version $env:PACKAGE_VERSION `
            -OutputDirectory "out\packages" `
            -Verify

      - name: Upload tested package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yauml-windows-x64-${{ github.sha }}
          path: |
            out/packages/*.zip
            out/packages/*.exe
            out/packages/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download tested package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yauml-windows-x64-${{ github.sha }}
          path: release-assets

      - name: Create or refresh release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            flags=(
              --verify-tag
              --generate-notes
              --title "$GITHUB_REF_NAME"
            )
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${flags[@]}"
          fi
