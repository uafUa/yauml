name: Windows CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  BUILD_DIRECTORY: build-ci
  QT_VERSION: 6.10.3
  IFW_VERSION: 4.11.0
  IFW_ARCHIVE: 4.11.0-0-202603231357ifw-win-x64.7z
  IFW_ARCHIVE_SHA1: d8b7596463f3d3215db7eaa25545b5b54cf3b8e9
  UPDATE_REPOSITORY_URL: https://uafua.github.io/yauml/updates/windows/x64/stable

jobs:
  build:
    name: Windows / build, test, and package
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: install-qt-action

      - name: Cache Qt Installer Framework
        id: ifw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qt-ifw-${{ env.IFW_VERSION }}
          key: qt-ifw-${{ runner.os }}-${{ env.IFW_VERSION }}-${{ env.IFW_ARCHIVE_SHA1 }}

      - name: Install verified Qt Installer Framework
        shell: pwsh
        run: |
          $ifwRoot = Join-Path $env:RUNNER_TEMP `
            "qt-ifw-$env:IFW_VERSION"
          if ("${{ steps.ifw-cache.outputs.cache-hit }}" -ne "true") {
            New-Item -ItemType Directory -Force -Path $ifwRoot | Out-Null
            $archive = Join-Path $env:RUNNER_TEMP $env:IFW_ARCHIVE
            $archiveUrl = `
              "https://download.qt.io/online/qtsdkrepository/" +
              "windows_x86/ifw/tools_ifw_411/qt.tools.ifw.411/" +
              $env:IFW_ARCHIVE
            Invoke-WebRequest -Uri $archiveUrl -OutFile $archive
            $actualSha1 = (Get-FileHash -LiteralPath $archive `
              -Algorithm SHA1).Hash.ToLowerInvariant()
            if ($actualSha1 -ne $env:IFW_ARCHIVE_SHA1) {
              throw "Qt IFW archive checksum mismatch: $actualSha1"
            }
            & 7z x $archive "-o$ifwRoot" -y
            if ($LASTEXITCODE -ne 0) {
              throw "Could not extract Qt Installer Framework."
            }
          }
          $binaryCreator = Join-Path $ifwRoot "bin\binarycreator.exe"
          if (-not (Test-Path -LiteralPath $binaryCreator -PathType Leaf)) {
            throw "Qt Installer Framework is incomplete at $ifwRoot."
          }
          "QIFW_ROOT=$ifwRoot" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $ifwRoot "bin") | Out-File `
            -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Locate LLVM
        shell: pwsh
        run: |
          $clang = (Get-Command clang.exe -ErrorAction Stop).Source
          $llvmRoot = Split-Path (Split-Path $clang -Parent) -Parent
          "LLVM_ROOT=$llvmRoot" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using LLVM from $llvmRoot"

      - name: Determine package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = "dev-$($env:GITHUB_SHA.Substring(0, 8))"
          }
          "PACKAGE_VERSION=$version" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Package version: $version"

      - name: Configure MSVC Release build
        shell: pwsh
        run: |
          cmake -S . -B $env:BUILD_DIRECTORY `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DYAUML_REQUIRE_LIBCLANG=ON `
            -DYAUML_DEPLOY_QT_RUNTIME=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build $env:BUILD_DIRECTORY `
            --config Release --parallel

      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "$(Join-Path $env:QT_ROOT_DIR 'bin');$env:PATH"
          ctest --test-dir $env:BUILD_DIRECTORY `
            -C Release --output-on-failure --timeout 60

      - name: Upload visual regression diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-diagnostics-${{ github.sha }}
          path: ${{ env.BUILD_DIRECTORY }}/visual-regression-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Create portable package
        shell: pwsh
        run: |
          $arguments = @{
            BuildDirectory = $env:BUILD_DIRECTORY
            Configuration = "Release"
            Version = $env:PACKAGE_VERSION
            OutputDirectory = "out\packages"
            Verify = $true
          }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $arguments.RequireProjectVersionMatch = $true
          }
          & .\tools\package_windows.ps1 @arguments

      - name: Create and verify Windows installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $releaseNotesUrl =
              "https://github.com/uafUa/yauml/releases/tag/$env:GITHUB_REF_NAME"
          } else {
            $releaseNotesUrl =
              "https://github.com/uafUa/yauml/releases"
          }
          & .\tools\build_windows_installer.ps1 `
            -PortableArchive `
              "out\packages\yauml-$env:PACKAGE_VERSION-windows-x64.zip" `
            -Version $env:PACKAGE_VERSION `
            -OutputDirectory "out\packages" `
            -UpdateSiteDirectory "out\update-site" `
            -UpdateRepositoryUrl $env:UPDATE_REPOSITORY_URL `
            -ReleaseNotesUrl $releaseNotesUrl `
            -Verify

      - name: Upload tested package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yauml-windows-x64-${{ github.sha }}
          path: |
            out/packages/*.zip
            out/packages/*.exe
            out/packages/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload stable update repository
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yauml-update-site-${{ github.sha }}
          path: out/update-site
          if-no-files-found: error
          retention-days: 2

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download tested package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yauml-windows-x64-${{ github.sha }}
          path: release-assets

      - name: Create or refresh release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # This job intentionally downloads only the verified artifacts. Give
          # gh an explicit repository because there is no checkout/.git tree
          # from which it could infer one.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            flags=(
              --verify-tag
              --generate-notes
              --title "$GITHUB_REF_NAME"
            )
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${flags[@]}"
          fi

  publish-updates:
    name: Publish stable update repository
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    needs:
      - build
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download tested update repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yauml-update-site-${{ github.sha }}
          path: update-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Package GitHub Pages site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: update-site

      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
